<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/img/tucheng-emblem-192.png">
<title>Sticker Card 闖關小卡</title>
<link rel="stylesheet" href="css/core.css">
<style>
  /* 闖關小卡: one card per child (a child plays only the six gates of their own level), two on an A4 page. Six places for the point stickers — no letter boxes
     (the Final Gate hands out the six letters) — the total, and the prize rule. */
  html{font-size:16px} html,body{overflow:auto;height:auto}
  body{background:#e9eefc;color:#14213d;user-select:text;-webkit-user-select:text;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Fredoka,sans-serif}
  .bar{max-width:210mm;margin:16px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;line-height:1.5}
  .bar button,.bar select{background:#152a63;color:#fff;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:700;border:0}
  .bar a{color:#152a63;font-weight:700}
  .page{width:210mm;height:297mm;overflow:hidden;margin:0 auto 10mm;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.15);break-after:page;display:grid;grid-template-rows:1fr 1fr}
  .qc{position:relative;padding:6.5mm 10mm 5.5mm;display:flex;flex-direction:column;gap:2.4mm;overflow:hidden}
  .qc + .qc{border-top:.3mm dashed #9aa6c8}
  .qc + .qc::before{content:"✂";position:absolute;left:3mm;top:-3.2mm;font-size:5mm;color:#9aa6c8;background:#fff;line-height:1}
  .top{display:flex;align-items:center;gap:4mm}
  .top img{width:30mm;height:30mm;flex:none;margin:-1.5mm 0 -2.5mm}
  .top .t{flex:1;min-width:0}
  .top .l1{display:flex;align-items:flex-end;gap:4mm}
  .top .sch{font-size:4mm;font-weight:700;color:#152a63;letter-spacing:.06em;white-space:nowrap}
  .top h1{margin:1.5mm 0 0;font:700 8.4mm/1.05 Fredoka,sans-serif;color:#152a63;white-space:nowrap}
  .top h1 span{font-family:Fredoka,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:6.4mm;color:#e0457b;margin-left:3mm}
  .who{margin-left:auto;font-size:4mm;font-weight:700;display:flex;gap:2.5mm;align-items:flex-end;white-space:nowrap}
  .who i{display:inline-block;border-bottom:.5mm solid #14213d;height:7mm}
  .cells{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:2.6mm;min-height:0}
  .cell{border:.6mm solid var(--c);border-radius:4mm;padding:1.6mm 2.4mm 2mm;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;align-items:center;column-gap:2mm;row-gap:1mm;background:color-mix(in srgb,var(--c) 7%,#fff);min-height:0}
  .cell .hd{grid-column:1 / 3;display:flex;align-items:center;gap:1.8mm;min-width:0;white-space:nowrap}
  .cell .n{width:9mm;height:9mm;border-radius:50%;background:var(--c);color:#0a1633;display:grid;place-items:center;font:700 6mm Fredoka,sans-serif;flex:none}
  .cell .nm{font:700 6mm/1.1 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;min-width:0;letter-spacing:.08em}
  .cell .zh{font:700 3.2mm/1.2 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#445;margin-left:auto}
  .cell .bdg{width:15mm;height:17mm;flex:none;line-height:0}.cell .bdg svg{width:100%;height:100%;overflow:visible}
  .stk{justify-self:center;width:30mm;height:30mm;border:.6mm dashed #8791b3;border-radius:50%;background:#fff;display:grid;place-items:center;color:#8791b3;font-size:3mm;font-weight:700;text-align:center;line-height:1.25}
  .foot{display:flex;align-items:center;gap:3mm;font-size:3.5mm;font-weight:700}
  .foot .rule{display:flex;gap:2mm;flex-wrap:nowrap;min-width:0}
  .foot .rule span{display:inline-flex;align-items:center;gap:1.2mm;padding:.8mm 2.4mm;border-radius:4mm;border:.4mm solid #c9b27a;background:#fffaf0;white-space:nowrap}
  .foot .rule b{font-size:5mm;line-height:1}
  .foot{justify-content:center}.foot .done{font-size:5mm;color:#152a63;padding:1mm 5mm;border-radius:5mm;border:.4mm solid #c9b27a;background:#fffaf0;white-space:nowrap}
  .foot .sum{margin-left:auto;white-space:nowrap;font-size:4mm}
  .foot .sum i{display:inline-block;width:22mm;border-bottom:.5mm solid #14213d;height:7mm;vertical-align:bottom}
  @media print{body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="bar">
  <button onclick="print()">🖨 列印</button>
  <select id="cnt"><option value="28">28 張（14 張 A4）</option><option value="32">32 張（16 張 A4）</option><option value="36">36 張（18 張 A4）</option><option value="2">2 張（試印 1 張 A4）</option></select>
  <span>闖關小卡：每位孩子一張（一張 A4 印兩張，沿虛線剪開）。每位孩子只闖<b>自己年級的六關</b>；每過一關，把老師發的<b>點數貼紙</b>（10／20／30 points）貼在這一關的圓圈裡，一共六張。卡上不用寫字母。<a href="index.html">🏠 回首頁 HOME</a></span>
</div>
<div id="pages"></div>
<script src="js/content.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/emblem.js"></script>
<script>
  const G = TC_CONTENT.gates, esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  // the teacher, 2026-11-22: only the country of each gate, in Chinese — no gate content on the card
  const COUNTRY = { "San Diego": "美國", Tokyo: "日本", Sydney: "澳洲", Vancouver: "加拿大", Cairo: "埃及", Paris: "法國" };
  const cell = (n) => `<div class="cell" style="--c:${G[n].color}"><div class="hd"><div class="n">${n}</div><div class="nm">${esc(COUNTRY[G[n].city] || "")}</div></div>
    <div class="bdg">${TC.badgeSVG ? TC.badgeSVG(n) : ""}</div><div class="stk"></div></div>`;
  const card = () => `<div class="qc"><div class="top"><img src="assets/img/tucheng-emblem.svg" alt="土城國小校徽"><div class="t"><div class="l1"><div class="sch">南投縣草屯鎮土城國民小學</div><div class="who">Name 姓名 <i style="width:33mm"></i> Class 班級 <i style="width:14mm"></i></div></div><h1>Tucheng English Day<span>Sticker Card 闖關小卡</span></h1></div></div>
    <div class="cells">${[1, 2, 3, 4, 5, 6].map(cell).join("")}</div>
    <div class="foot"><span class="done">🎉 六個章都蓋滿，就可以到終點站領取小獎品！</span></div></div>`;
  const cnt = document.getElementById("cnt");
  function render() { const n = +cnt.value || 28, out = []; for (let i = 0; i < Math.ceil(n / 2); i++) out.push(`<div class="page">${card()}${card()}</div>`); document.getElementById("pages").innerHTML = out.join(""); }
  cnt.onchange = render; render();
</script>
</body>
</html>
