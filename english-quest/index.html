<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/img/tucheng-emblem-192.png">
<title>Tucheng English Day</title>
<link rel="stylesheet" href="css/core.css">
<style>
  html{font-size:clamp(13px,1.05vw,20px)} html,body{overflow:auto;height:auto}
  body{background:radial-gradient(120% 80% at 50% 0%,#1d3a86,#0a1633) fixed;padding:2rem 1.6rem 4rem}
  .hero{display:flex;align-items:center;gap:2rem;max-width:90rem;margin:0 auto 2rem}
  .hero .o{width:9rem;height:10.5rem;flex:0 0 auto}
  .hero h1{margin:0;font-size:3.4rem;line-height:1.05}
  .hero p{margin:.4rem 0 0;color:var(--ink2);font-size:1.3rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.2rem;max-width:90rem;margin:0 auto}
  a.card{display:block;text-decoration:none;color:#fff;background:var(--panel);border:2px solid var(--line);border-radius:1.6rem;padding:1.3rem 1.4rem;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
  a.card:hover{transform:translateY(-.3rem);border-color:var(--c)}
  a.card .n{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:.8rem;background:var(--c);color:#0a1633;font-weight:700;font-size:1.6rem}
  a.card h2{margin:.7rem 0 .2rem;font-size:1.7rem}
  a.card .zh{color:var(--ink2);font-size:1.1rem}
  a.card .g{font-size:1rem;color:var(--ink2);margin-top:.6rem}
  a.card img{position:absolute;right:.8rem;top:.6rem;width:6.4rem;height:6.4rem;filter:drop-shadow(0 .6rem .8rem rgba(0,0,0,.4));transition:transform .2s}
  a.card .bdg{position:absolute;right:.4rem;top:-.6rem;width:9.6rem;height:11rem;line-height:0;transition:transform .2s}a.card .bdg svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .6rem .8rem rgba(0,0,0,.4))}a.card:hover .bdg{transform:scale(1.08) rotate(-4deg)}
  a.card:hover img{transform:scale(1.12) rotate(-6deg)}
  h3{max-width:90rem;margin:2.4rem auto .8rem;font-size:1.4rem;color:var(--sun)}
  .tools a.card{--c:#ffc83d}
  .lv-home{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;max-width:90rem;margin:0 auto 1.6rem}
  .lv-home .lv-t{font-size:1.5rem;font-weight:700;color:var(--sun)}
  .lv-home button{display:flex;flex-direction:column;align-items:center;min-width:13rem;padding:.8rem 1.6rem;border-radius:1.6rem;line-height:1.15;cursor:pointer;
    background:linear-gradient(180deg,#3a4f93,#24346b);color:#dfe7ff;border:0;box-shadow:0 .45rem 0 #121c42}
  .lv-home button b{font-size:2.2rem}.lv-home button i{font-style:normal;font-size:1.1rem;opacity:.9}
  .lv-home button[aria-checked=true]{background:linear-gradient(180deg,#7dffd8,#2ee6b6 55%,#14b88d);color:#063a2c;box-shadow:0 .45rem 0 #0b7a5c}
  .lv-home button[aria-checked=true] b::before{content:"✓ "}
  footer{max-width:90rem;margin:3rem auto 0;color:var(--ink2);font-size:.95rem;line-height:1.6}
  footer a{color:var(--sky)}
</style>
</head>
<body>
<div class="hero">
  <div class="o" id="o"></div>
  <div>
    <div class="tc-brand" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:2.4rem;color:#ffe58a;letter-spacing:.06em;margin-bottom:.6rem"><img src="assets/img/tucheng-emblem.svg" alt="土城國小校徽" style="width:5.4rem;height:5.4rem;flex:none">南投縣草屯鎮土城國民小學</div>
    <h1>Tucheng English Day<br><span class="zh" style="font-size:2.2rem">土城國小 運動會英語日 · 英語闖關（空手來就好）</span></h1>
    <p class="zh">6 間教室 × 6 個遊戲關卡 · 老師按 START → 歐力用英文問、孩子看圖說英文（低年級認字母做動作、中年級念整句、高年級填空） → AI 聽懂就過關 → 打開神秘禮物盒念一句 → 刮刮卡刮出 10／20／30 點，老師發點數貼紙 → 終點登機門解碼拿獎狀、換獎品</p>
  </div>
</div>
<div class="lv-home" id="lvHome" role="radiogroup" aria-label="題目難度">
  <span class="zh lv-t">選擇題目：</span>
  <button data-l="1" role="radio"><b class="zh">低年級</b><i class="zh">1–2 年級 · 認字母＋做動作</i></button>
  <button data-l="2" role="radio"><b class="zh">中年級</b><i class="zh">3–4 年級 · 看整句念</i></button>
  <button data-l="3" role="radio"><b class="zh">高年級</b><i class="zh">5–6 年級 · 填空說</i></button>
</div>
<div class="grid" id="gates"></div>
<!-- 115.11.20: tools and source notes hidden from the public home page (pages still open by direct address for teachers) -->
<script src="js/content.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/emblem.js"></script>
<script src="js/art-body.js"></script>
<script>
  document.getElementById("o").innerHTML = TC.ollieSVG();
  const ICON = { rescue: "trophy", talk: "mic", tpr: "medal", monster: "mystegg", chant: "star", story: "gift" }, icons = new Proxy({}, { get: (_, n) => ICON[TC_CONTENT.gates[n].key] });
  const g = document.getElementById("gates");
  [1, 2, 3, 4, 5, 6].forEach((n) => {
    const G = TC_CONTENT.gates[n];
    g.insertAdjacentHTML("beforeend", `<a class="card" style="--c:${G.color}" data-gate="${n}" href="station.html?gate=${n}&lv=${TC.cfg.level}#gate-${n}"><div class="bdg">${TC.badgeSVG ? TC.badgeSVG(n) : `<img src="${TC.art(icons[n])}" alt="">`}</div><span class="n">${n}</span><h2>${G.title}</h2><div class="zh">${G.zh} · ${G.city}</div><div class="g">${G.genre}</div></a>`);
  });
</script>
<script>
  // 115.11.20: choose 低／中／高年級 here; every gate link carries it (?lv=), and the TV remembers it
  (function () {
    const box = document.getElementById("lvHome");
    function paint() {
      box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(+b.dataset.l === TC.cfg.level)));
      document.querySelectorAll("#gates a.card").forEach((a) => { const n = a.dataset.gate; a.href = `station.html?gate=${n}&lv=${TC.cfg.level}#gate-${n}`; });
    }
    box.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; TC.cfg.level = +b.dataset.l; TC.saveCfg(); paint(); });
    paint();
  })();
</script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
