<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Barcelona Block Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: a chunky block-world adventure game, bright and bold
   IDEA: a pixel-block Barcelona you can dig, build and play football in, unlocking the picture-book lines quest by quest
   PICTURE: full-screen voxel world with pixel textures, blocky avatar and NPCs
   COLOUR and TYPE: sky blue, grass green, gold; pixel font for labels, Baloo 2 + Noto Sans TC for text
   LAYOUT: game fills the screen; quest card top-left, hotbar bottom, dialogue panel above it */
:root{color-scheme:light;--ink:#1d1b2e;--gold:#ffc531;--grass:#5cb54a;--panel:rgba(20,18,38,.86)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#87c9ff;font:16px/1.45 "Baloo 2","Noto Sans TC",system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.02em}
.quest{position:fixed;left:12px;top:12px;width:min(340px,calc(100vw - 24px));background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #5a5470;padding:10px 12px;border-radius:4px;z-index:5}
.quest .n{font-size:10px;color:var(--gold)}.quest h2{margin:4px 0 2px;font:800 22px/1.1 "Baloo 2";color:#fff}
.quest p{margin:4px 0 0;font:700 15px/1.45 "Noto Sans TC";color:#e9e4ff}
.bar{height:10px;background:#000;border:2px solid #5a5470;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7cff6b,#2fbf4f);width:0;transition:width .3s}
.tr{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:flex-end}
.tb{min-width:48px;min-height:48px;padding:0 12px;background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #5a5470;font:800 15px "Noto Sans TC";display:flex;align-items:center;gap:6px;border-radius:4px}
.tb[aria-pressed=true]{background:#2f7d3a;box-shadow:inset 0 0 0 3px #7cff6b}
.modes{position:fixed;right:12px;bottom:96px;display:flex;flex-direction:column;gap:8px;z-index:5}
.modes .tb{min-width:84px;justify-content:center;font-size:17px}
.hot{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:10px;display:flex;gap:4px;padding:4px;background:#000;border:3px solid #5a5470;z-index:5;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:58px;height:58px;flex:none;background:#8b8b8b;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #c6c6c6;display:grid;place-items:center}
.slot.on{outline:4px solid #fff;outline-offset:-2px;z-index:1}
.slot canvas{width:38px;height:38px;image-rendering:pixelated}
.slot b{position:absolute;right:3px;bottom:1px;font:10px "Press Start 2P";color:#fff;text-shadow:2px 2px 0 #000}
.slot span{position:absolute;left:3px;top:2px;font:8px "Press Start 2P";color:#fff;text-shadow:1px 1px 0 #000}
.dlg{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(720px,calc(100vw - 20px));background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #5a5470;padding:12px 14px;display:none;z-index:8;border-radius:4px}
.dlg.on{display:block;animation:up .25s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.dlg .who{display:flex;align-items:center;gap:8px;font:800 15px "Baloo 2";color:var(--gold)}
.dlg .who i{width:22px;height:22px;display:inline-block;border:3px solid #000}
.dlg .en{font:800 clamp(22px,3.4vw,30px)/1.2 "Baloo 2";margin:4px 0}
.dlg .zh{font:700 17px "Noto Sans TC";color:#cfc8ee}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}
.btn{min-height:48px;padding:0 18px;background:#5cb54a;border:4px solid #000;box-shadow:inset 0 -5px 0 #2f7d3a,inset 0 0 0 2px #9be08a;font:800 17px "Noto Sans TC";color:#fff;border-radius:3px}
.btn.alt{background:#ffc531;color:#1d1b2e;box-shadow:inset 0 -5px 0 #c99400,inset 0 0 0 2px #ffe58a}
.btn.ghost{background:#6b6688;box-shadow:inset 0 -5px 0 #403b5c,inset 0 0 0 2px #9a95b8}
.btn:active{transform:translateY(2px)}
.choice{display:grid;gap:8px;margin-top:8px}
.choice button{min-height:52px;text-align:left;padding:8px 14px;background:#2b2846;border:3px solid #000;box-shadow:inset 0 0 0 2px #6b6688;font:800 20px "Baloo 2";border-radius:3px}
.choice button.ok{background:#2f9e4a}.choice button.no{background:#c4433a;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.act{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;display:none}
.act.on{display:block}
.act .btn{min-height:68px;font-size:24px;padding:0 30px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200%);z-index:20;background:#000;border:3px solid var(--gold);padding:10px 18px;font:800 17px "Noto Sans TC";transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(#3c8de0cc,#1d1b2ecc);padding:16px;overflow:auto}
.screen.off{display:none}
.card{background:#2b2846;border:6px solid #000;box-shadow:inset 0 0 0 4px #6b6688,0 12px 0 rgba(0,0,0,.35);padding:20px;max-width:760px;width:100%;text-align:center;border-radius:6px}
.card h1{margin:0 0 6px;font:22px/1.4 "Press Start 2P";color:var(--gold);text-shadow:4px 4px 0 #000}
.card .sub{font:800 20px "Noto Sans TC";margin-bottom:12px}
.card p{font:700 16px/1.6 "Noto Sans TC";color:#e9e4ff;margin:6px 0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:14px 0}
.pick button{padding:8px 4px;background:#1d1b2e;border:4px solid #000;box-shadow:inset 0 0 0 3px #5a5470;border-radius:4px;font:800 16px "Baloo 2"}
.pick button[aria-pressed=true]{box-shadow:inset 0 0 0 4px var(--gold);background:#3a3560}
.pick canvas{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.learn{display:grid;gap:6px;text-align:left;margin:12px 0}
.learn div{display:flex;gap:8px;align-items:center;background:#1d1b2e;padding:6px 10px;border:3px solid #000;font:800 18px "Baloo 2"}
.learn small{display:block;font:700 13px "Noto Sans TC";color:#bdb6e0}
.learn button{flex:none;width:44px;height:44px;background:#ffc531;border:3px solid #000;color:#1d1b2e;font-weight:900}
.help{font:600 13px "Noto Sans TC";color:#bdb6e0}
.cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:4;display:none}
@media(max-width:640px){.quest h2{font-size:18px}.quest p{font-size:13px}.slot{width:46px;height:46px}.slot canvas{width:30px;height:30px}.modes{bottom:80px}.dlg{bottom:72px}.card h1{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="方塊世界，可拖曳旋轉視角，點地面走路"></canvas>
<section class="quest" aria-live="polite"><div class="n px" id="qn">QUEST 1/8</div><h2 id="qt"></h2><p id="qo"></p><div class="bar"><i id="qb"></i></div></section>
<div class="tr"><button class="tb" id="zh" aria-pressed="true">中文字幕</button><button class="tb" id="zin" aria-label="拉近">＋</button><button class="tb" id="zout" aria-label="拉遠">－</button><button class="tb" id="book" aria-label="句子本">句子本</button></div>
<div class="modes" role="group" aria-label="模式"><button class="tb" data-m="walk" aria-pressed="true">走路</button><button class="tb" data-m="mine">挖方塊</button><button class="tb" data-m="place">放方塊</button></div>
<div class="hot" id="hot"></div>
<div class="act" id="act"></div>
<section class="dlg" id="dlg" aria-live="polite"></section>
<div class="toast" id="toast"></div>
<section class="screen" id="start"><div class="card">
 <h1>BARCELONA BLOCK QUEST</h1><div class="sub">方塊巴塞隆納大冒險・五年級</div>
 <p>撿車票、看月曆說出今天星期幾、用金磚蓋出聖家堂、用西班牙文說 Hola，再走進足球場踢 PK！完成 8 個任務，學會繪本裡的英文句子。</p>
 <p><b>選你的角色：</b></p><div class="pick" id="pick"></div>
 <button class="btn alt" id="go" style="font-size:22px;min-height:60px">開始冒險 START</button>
 <p class="help">操作：點地面＝走路；拖曳＝旋轉視角；切到「挖方塊」點方塊挖起來，切到「放方塊」點方塊旁邊把方塊放上去。</p>
</div></section>
<section class="screen off" id="end"><div class="card"><h1>QUEST CLEAR!</h1><div class="sub" id="endSub"></div><div class="learn" id="learn"></div><button class="btn alt" id="again">再玩一次</button> <button class="btn ghost" id="free">繼續自由建造</button><p class="help">標示 AI 語音的句子為電腦合成，其餘為真人錄音；授權見句子本最下方。角色、方塊材質與遊戲為原創設計。</p></div></section>
