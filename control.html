<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Final Gate</title>
<link rel="stylesheet" href="css/core.css">
<style>
  :root{--gate:#ffc83d}
  #stage{background:radial-gradient(120% 90% at 50% 0%,#1d3a86,#0a1633)}
  .tabs{display:flex;gap:.6rem}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:.6rem 1.2rem;font-size:1.5rem;font-weight:600}
  .tabs button.on{background:var(--sun);color:#0a1633}
  .view{position:absolute;inset:7.5rem 0 0 0}
  /* route map */
  .route{position:absolute;left:3%;right:3%;top:2%;height:30%}
  .route svg{width:100%;height:100%}
  .stats{position:absolute;left:0;right:0;top:33%;display:flex;justify-content:center;gap:1.4rem}
  .stat{background:var(--panel);border:2px solid var(--line);border-radius:1.4rem;padding:.8rem 1.8rem;text-align:center;min-width:16rem}
  .stat b{display:block;font-size:4.4rem;line-height:1;color:var(--sun)}
  .stat span{font-size:1.4rem;color:var(--ink2)}
  /* decoder */
  .dec{position:absolute;left:0;right:0;top:31%;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
  .dec h2{margin:0;font-size:3.6rem}
  .slots{display:flex;gap:1rem}
  .slot{width:8rem;height:9.4rem;border-radius:1.2rem;border:.4rem solid var(--sun);background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:6.4rem;font-weight:700;position:relative}
  .slot small{position:absolute;top:.3rem;left:.6rem;font-size:1.1rem;color:var(--ink2);font-weight:600}
  .slot.bad{border-color:var(--red);animation:shake .4s}
  .slot.good{background:var(--sun);color:#0a1633}
  .keys{display:grid;grid-template-columns:repeat(14,1fr);gap:.5rem;width:min(92vw,110rem)}
  .keys button{background:#2b3f7a;border-radius:1rem;font-size:2.2rem;font-weight:700;padding:.55rem 0;box-shadow:0 .3rem 0 rgba(0,0,0,.35)}
  .keys button:active{transform:translateY(.2rem)}
  .keys .wide{grid-column:span 2;background:#5a2b4f}
  body.decoding .stats{display:none}
  .attract{position:absolute;left:0;right:0;top:47%;text-align:center}
  .attract h2{font-size:5rem;margin:.5rem 0}
  /* certificate */
  .cert{width:min(120rem,94vw,calc((100vh - 9rem) * 1.414));aspect-ratio:1.414;font-size:min(1rem,calc((100vh - 9rem) / 88));background:#fffdf5;color:#0a1633;border-radius:1.6em;padding:3% 4%;position:relative;box-shadow:0 2em 6em rgba(0,0,0,.5);border:1.2em solid #ffc83d;display:flex;flex-direction:column;align-items:center;text-align:center;animation:zoomIn .7s cubic-bezier(.2,1.4,.4,1)}
  .cert .k1{font-size:1.8em;letter-spacing:.4em;color:#5a6aa8;font-weight:700}
  .cert h1{font-size:5.6em;margin:.1em 0 0;line-height:1}
  .cert .zh{font-size:2.4em}
  .cert .nm{font-size:8em;font-weight:700;color:#d6337a;margin:.18em 0 .05em;line-height:1}
  .cert p{font-size:2em;margin:.2em 0}
  .cert .st{display:flex;gap:1.4em;margin:1.6em 0}
  .cert .st div{width:6.4em;height:6.4em;border-radius:50%;border:.35em double var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:1.4em;transform:rotate(-10deg);line-height:1.1}
  .cert .ft{margin-top:auto;display:flex;justify-content:space-between;width:100%;font-size:1.6em;color:#5a6aa8}
  .cert .ow{position:absolute;right:3%;top:4%;width:10em;height:11.5em}
  /* live board */
  .board{position:absolute;inset:1rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(22rem,1fr));gap:1rem;align-content:start;overflow:auto}
  .kc{background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem}
  .kc .av{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.8rem;color:#0a1633;flex:0 0 auto}
  .kc b{font-size:1.6rem;display:block}
  .kc .dots{display:flex;gap:.35rem;margin-top:.3rem}
  .kc .dots i{width:1.4rem;height:1.4rem;border-radius:50%;background:rgba(255,255,255,.15)}
  .kc.fin{border-color:var(--sun);box-shadow:0 0 1.2rem rgba(255,200,61,.4)}
  .src{position:absolute;right:2rem;bottom:1rem;font-size:1.2rem;color:var(--ink2)}
  @media print{
    body *{visibility:hidden}
    .cert,.cert *{visibility:visible}
    .cert{position:fixed;left:0;top:0;width:100%;border-radius:0;box-shadow:none;animation:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4 landscape;margin:0}
  }
</style>
</head>
<body>
<div id="stage">
  <section class="view" id="vGate">
    <div class="route" id="route"></div>
    <div class="stats"><div class="stat"><b id="sKids">0</b><span class="zh">完成環遊的小旅客</span></div><div class="stat"><b id="sLines">0</b><span class="zh">今天說出的英文句子</span></div><div class="stat"><b id="sStamps">0</b><span class="zh">已蓋的關卡印章</span></div></div>
    <div class="attract" id="attract">
      <div class="scan-box" style="display:inline-flex"><span class="qr">🛂</span><span>Final Gate: scan your passport! <span class="zh">終點登機門：請掃描護照</span></span></div>
      <h2 class="zh">集滿 6 個秘密字母，解開密碼就能登機！</h2>
      <div class="scan-actions" style="justify-content:center"><button class="big-btn" id="camBtn">📷 <span class="zh">相機掃描</span></button><button class="big-btn" id="manBtn">👆 <span class="zh">手動選擇</span></button></div>
    </div>
    <div class="dec hidden" id="dec">
      <h2 id="decTitle">What's the secret word?</h2>
      <div class="slots" id="slots"></div>
      <div class="keys" id="keys"></div>
      <div class="hint zh">看你護照卡上的 6 個字母，依序按下去！也可以直接用英文說出這個字。</div>
    </div>
  </section>
  <section class="view hidden" id="vBoard"><div class="board" id="board"></div><div class="src" id="boardSrc"></div></section>
</div>

<header id="hud">
  <div class="gate-badge"><div class="num">★</div><div><div class="t1">Final Gate</div><div class="t2"><span class="zh">終點登機門</span> · Mission Control</div></div></div>
  <div class="kid-chip hidden" id="kidChip"><div class="av" id="kAv">A</div><span id="kName">Amy</span></div>
  <div class="tabs" style="margin-left:auto"><button class="on" data-v="vGate">🏁 Final Gate</button><button data-v="vBoard">📊 Live Board</button></div>
  <div class="ai-pill" id="aiPill"><i></i>AI</div>
  <button class="icon-btn" id="setBtn">⚙</button>
</header>

<section id="talk">
  <div class="talk-main">
    <div class="t-row"><span class="who t">Teacher</span><div class="t-line" id="tLine"></div></div>
    <div class="t-row" style="margin-top:.4rem"><span class="who k">You 你說</span><div class="k-line" id="kLine"></div></div>
    <div class="heard" id="heard">&nbsp;</div>
  </div>
  <div class="talk-side">
    <button class="big-btn btn-ok" id="okBtn">✓ <span class="zh">說得好</span></button>
    <button class="big-btn btn-hear" id="hearBtn">🔊 <span class="zh">聽示範</span> <span class="src-tag" id="srcTag"></span></button>
    <div class="meter"><i id="micMeter"></i></div>
    <button class="big-btn btn-skip" id="skipBtn">⏭ <span class="zh">跳過</span></button>
  </div>
</section>

<script src="js/vendor/jsQR.js"></script>
<script src="js/content.js"></script>
<script src="assets/audio/credits.js"></script>
<script src="js/passport-code.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/control.js"></script>
</body>
</html>
