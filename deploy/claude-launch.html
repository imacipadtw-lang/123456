<title>土城國小英語闖關</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: a launch board — six gate tiles (the classroom TVs), the Final Gate, then the teacher tools. */
:root {
  --bg: #f3f6fb; --panel: #ffffff; --fg: #17223b; --muted: #5b6784; --line: #dbe2ef; --accent: #2f6bff;
  --display: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1526; --panel: #182038; --fg: #eef2fb; --muted: #a6b1cc; --line: #2a3554; --accent: #7aa2ff; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1526; --panel: #182038; --fg: #eef2fb; --muted: #a6b1cc; --line: #2a3554; --accent: #7aa2ff; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55 }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0; text-wrap: balance; letter-spacing: .01em }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.45rem; margin: 0 }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 65ch }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: .92rem; max-width: 80ch }
.note b { color: var(--fg) }
.gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px }
.gate { --c: var(--accent); display: grid; grid-template-columns: 112px 1fr; gap: 4px 14px; align-items: center; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 14px; padding: 14px; transition: transform .15s ease, box-shadow .15s ease }
.gate:hover, .gate:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(20, 40, 90, .14); outline: none }
.gate:focus-visible { box-shadow: 0 0 0 3px var(--c) }
.gate .bdg { width: 112px; height: 128px; grid-row: span 3; line-height: 0 }
.gate .bdg svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 6px rgba(20, 40, 90, .25)) }
.gate:hover .bdg svg { transform: scale(1.06) rotate(-3deg); transition: transform .2s }
.gate .no { font-family: var(--display); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.gate .zh { font-size: 1.05rem; color: var(--muted); min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 10px }
.lv { display: flex; flex-wrap: wrap; gap: 10px }
.lv button { font: inherit; cursor: pointer; display: grid; gap: 2px; text-align: left; min-width: min(200px, 100%); padding: 10px 18px; border-radius: 14px; background: var(--panel); color: var(--fg); border: 2px solid var(--line) }
.lv button b { font-family: var(--display); font-size: 1.25rem }
.lv button span { font-size: .88rem; color: var(--muted) }
.lv button[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent) }
.lv button[aria-checked="true"] b::before { content: "✓ " }
.lv button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.tool { text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; font-size: 1.1rem; font-weight: 700 }
.tool:hover, .tool:focus-visible { border-color: var(--accent); outline: none }
.tool.main { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700 }
@media (prefers-reduced-motion: reduce) { .gate { transition: none } .gate:hover { transform: none } }
</style>

<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><img src="assets/img/tucheng-emblem.svg" alt="土城國小校徽" style="width:84px;height:84px;flex:none">
    <div><div style="font-weight:700;letter-spacing:.08em;color:var(--muted)">南投縣草屯鎮土城國民小學</div><h1>運動會英語日 English Day</h1></div></div>
    <p class="lead">六間教室各開一關。先選年級，再點下面的關卡，在該教室的大螢幕上按全螢幕（F11）就能開始。</p>
  </header>

  <section aria-labelledby="lv-h" style="display:grid;gap:10px">
    <h2 id="lv-h">先選年級 Level</h2>
    <div class="lv" id="lv" role="radiogroup" aria-label="題目難度">
      <button type="button" role="radio" data-l="1"><b>低年級</b><span>1–2 年級 · 認字母＋做動作</span></button>
      <button type="button" role="radio" data-l="2"><b>中年級</b><span>3–4 年級 · 看整句念</span></button>
      <button type="button" role="radio" data-l="3"><b>高年級</b><span>5–6 年級 · 填空說</span></button>
    </div>
  </section>

  <section aria-labelledby="g-h" style="display:grid;gap:12px">
    <h2 id="g-h">六關大螢幕 Gates 1–6</h2>
    <div class="gates" id="gates"></div>
  </section>


</div>

<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/emblem.js"></script>
<script>
(function () {
  // Deep links: this page's URL + #gate-1 … #gate-6, #final, #opening opens that screen directly.
  // the level (低／中／高年級) is chosen here, like on the main site's home page; every gate link carries it as ?lv=
  function saved() { try { var v = +localStorage.getItem("tc_launch_lv"); return v >= 1 && v <= 3 ? v : 0; } catch (e) { return 0; } }
  function route() {
    var h = (location.hash || "").slice(1);
    var m = h.match(/^gate-([1-6])$/);
    if (m) { location.replace("station.html?gate=" + m[1] + (saved() ? "&lv=" + saved() : "") + "#gate-" + m[1]); return true; }
    if (h === "final") { location.replace("control.html"); return true; }
    if (h === "opening") { location.replace("opening.html"); return true; }
    return false;
  }
  window.addEventListener("hashchange", route);
  if (route()) return;

  // gate list comes from the same content file the games use, so names and themes always match
  var C = (window.TC_CONTENT && TC_CONTENT.gates) || {};
  var G = [1, 2, 3, 4, 5, 6].filter(function (n) { return C[n]; }).map(function (n) { return [n, C[n].title, C[n].zh + " · " + C[n].teacher, C[n].color]; });
  var box = document.getElementById("gates");
  G.forEach(function (g) {
    var a = document.createElement("a");
    a.className = "gate"; a.dataset.gate = g[0]; a.href = "station.html?gate=" + g[0] + "#gate-" + g[0]; a.style.setProperty("--c", g[3]);
    var img = document.createElement("div"); img.className = "bdg";
    try { if (window.TC && TC.badgeSVG) img.innerHTML = TC.badgeSVG(g[0]); } catch (e) {}
    var no = document.createElement("span"); no.className = "no"; no.textContent = "Gate " + g[0];
    var t = document.createElement("h2"); t.textContent = g[1];
    var zh = document.createElement("span"); zh.className = "zh"; zh.textContent = g[2];
    a.append(img, no, t, zh); box.append(a);
  });
  var lv = saved() || 2, pick = document.getElementById("lv");
  function paint() {
    pick.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-checked", String(+b.dataset.l === lv)); });
    box.querySelectorAll("a.gate").forEach(function (a) { var n = a.dataset.gate; a.href = "station.html?gate=" + n + "&lv=" + lv + "#gate-" + n; });
  }
  pick.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; lv = +b.dataset.l; try { localStorage.setItem("tc_launch_lv", String(lv)); } catch (err) {} paint(); });
  paint();
})();
</script>
